# shared settings for both halves

# sleep after 30min (30*60*1000ms)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# required for the &soft_off behavior on the tri layer
CONFIG_ZMK_PM_SOFT_OFF=y

# peripheral battery level reported via the central
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# max radio power for the nRF52840, trades battery life for range/stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# rgbled widget: solid color while a layer is active
# 0=off 1=red 2=green 3=yellow 4=blue 5=magenta 6=cyan 7=white
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=5
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=3
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=1
